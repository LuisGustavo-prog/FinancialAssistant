services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    environment:
      ALLOWED_ORIGINS: "http://127.0.0.1:8080,http://localhost:8080"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      TIMEZONE: "America/Sao_Paulo"
      DATABASE_PATH: "data/financial_assistant.db"

  web:
    build: ./frontend
    environment:
      VITE_API_URL: "http://127.0.0.1:8000"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
